{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/homestyles.css' %}" rel="stylesheet">
</head>
<body>

<div class="main-background">
<div class="background">

    <!-- HEADER -->
    <div class="header">
        A Situational Analytic Method for User Behavior Pattern in Multimedia Social Networks
    </div>

    <!-- NAV BAR -->
    <div class="nav-bar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'admin_login' %}" class="active">Admin</a>
        <a href="{% url 'user_login' %}">User</a>
        <a href="{% url 'register' %}">Registration</a>
    </div>

    <!-- BANNER (UNCHANGED) -->
    <div class="banner">
        <img class="slide active" src="{% static 'images/banner_img1.png' %}">
        <img class="slide" src="{% static 'images/banner_img2.png' %}">
        <img class="slide" src="{% static 'images/banner_img3.png' %}">

          <div class="slider-btn prev" onclick="changeSlide(-1)">prev</div>
    <div class="slider-btn next" onclick="changeSlide(1)">next</div>
    </div>
    

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- CONTENT AREA -->
    <div class="content">

        <!-- LEFT: ADMIN LOGIN -->
        <div class="login-box">
            <h3>Admin Login</h3>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>UserName</label>
                    <input type="text" name="username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password">
                </div>

                <button type="submit">Login</button>
            </form>
        </div>

        <!-- RIGHT: SIDEBAR -->
       <div class="sidebar">
    <h4>Sidebar Menu</h4>
    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'admin_login' %}" class="active">Admin</a></li>
        <li><a href="{% url 'user_login' %}">User</a></li>
        <li><a href="{% url 'register' %}">Registration</a></li>
    </ul>
</div>
    </div>

</div>
</div>
<script>
    let slideIndex = 0;
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    function showSlide(index) {
        if (index >= slides.length) slideIndex = 0;
        if (index < 0) slideIndex = slides.length - 1;

        slides.forEach(slide => slide.classList.remove("active"));
        dots.forEach(dot => dot.classList.remove("active"));

        slides[slideIndex].classList.add("active");
        dots[slideIndex].classList.add("active");
    }

    function changeSlide(n) {
        slideIndex += n;
        showSlide(slideIndex);
    }

    function currentSlide(n) {
        slideIndex = n;
        showSlide(slideIndex);
    }

    // Auto slide every 4 seconds
    setInterval(() => {
        slideIndex++;
        showSlide(slideIndex);
    }, 4000);
</script>
</body>
</html>
