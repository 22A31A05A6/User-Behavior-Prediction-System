{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Social Network</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="{% static 'css/homestyles.css' %}" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
     <div class="background">
    <div class="header">
        A Situational Analytic Method for User Behavior Pattern in Multimedia Social Networks
    </div>

    <!-- NAVIGATION -->
    <div class="nav-bar">
        <a href="{% url 'home' %}" class="active">Home</a>
        <a href="{% url 'admin_login' %}">Admin</a>
        <a href="{% url 'user_login' %}">User</a>
        <a href="{% url 'register' %}">Registration</a>
    </div>

  <!-- BANNER -->
<div class="banner">
    <img class="slide active" src="{% static 'images/banner_img1.png' %}" alt="Banner 1">
    <img class="slide" src="{% static 'images/banner_img2.png' %}" alt="Banner 2">
    <img class="slide" src="{% static 'images/banner_img3.png' %}" alt="Banner 3">

    <div class="slider-btn prev" onclick="changeSlide(-1)">prev</div>
    <div class="slider-btn next" onclick="changeSlide(1)">next</div>
</div>

<!-- DOTS -->
<div class="dots">
    <span class="dot active" onclick="currentSlide(0)"></span>
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
</div>
</div>
<script>
    let slideIndex = 0;
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    function showSlide(index) {
        if (index >= slides.length) slideIndex = 0;
        if (index < 0) slideIndex = slides.length - 1;

        slides.forEach(slide => slide.classList.remove("active"));
        dots.forEach(dot => dot.classList.remove("active"));

        slides[slideIndex].classList.add("active");
        dots[slideIndex].classList.add("active");
    }

    function changeSlide(n) {
        slideIndex += n;
        showSlide(slideIndex);
    }

    function currentSlide(n) {
        slideIndex = n;
        showSlide(slideIndex);
    }

    // Auto slide every 4 seconds
    setInterval(() => {
        slideIndex++;
        showSlide(slideIndex);
    }, 4000);
</script>

   
</body>
</html>
